name: Test Publish to Public Repo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Create test output
        run: |
          mkdir output
          echo "Test successful at $(date)" > output/test.txt

      - name: Push to public repo
        run: |
          cd output

          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Test publish"

          git branch -M main

          git remote add origin https://x-access-token:${{ secrets.FSLTL_COPY_BASE_TO_PUBLIC_REPO }}@github.com/FSLiveTrafficLiveries/FSLTL_BaseModels_Releases.git
          git push origin main --force
``
